<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2e9"><meta name="description" content="Отслеживание заказа LEPÍ.">
<title>Мой заказ — LEPÍ</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2e9;--ink:#30372e;--muted:#85897d;--green:#667b5b;--deep:#43583e;--line:#dfe5d8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% 8%,#dfe6d1a8,transparent 32%),radial-gradient(ellipse at 95% 42%,#efe0c5a0,transparent 32%),var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif}
.top{padding:22px 5%;border-bottom:1px solid #ffffffa6;background:#f5f2e9d9}.nav{width:min(900px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font:600 35px/1 "Cormorant Garamond",serif;letter-spacing:.16em;color:var(--ink);text-decoration:none}.logo span{color:var(--green)}.back{font-size:12px;font-weight:600;color:var(--deep);text-decoration:none}
main{width:min(680px,90%);margin:48px auto 70px}.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--green);font-weight:700}
h1{font:500 clamp(43px,8vw,65px)/.95 "Cormorant Garamond",serif;letter-spacing:-.03em;margin:15px 0 8px}.sub{font-size:12px;line-height:1.8;color:var(--muted);margin:0 0 25px}
.paper{padding:clamp(20px,5vw,34px);border:1px solid white;border-radius:27px;background:#ffffff91;box-shadow:inset 0 1px #fff,0 18px 50px #35432a0c}
.order-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.order-no{font-size:12px;font-weight:700;color:var(--deep)}.updated{font-size:10px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:30px;background:#e6eddf;color:#456642;font-size:11px;font-weight:700;margin:20px 0}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.progress-head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 16px}
.progress-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.progress-count{font-size:10px;color:var(--green);font-weight:700}
.timeline{display:grid;gap:0;margin:0 0 28px}
.stage{display:grid;grid-template-columns:42px 1fr;gap:13px;position:relative;min-height:66px}
.stage:not(:last-child):before{content:"";position:absolute;left:19px;top:40px;bottom:-1px;width:2px;border-radius:3px;background:#e5e8df}
.stage.done:not(:last-child):before{background:linear-gradient(var(--green),#a9b99c)}
.stage-icon{width:42px;height:42px;border:1px solid #e3e8df;border-radius:14px;background:#f1f3ed;color:#a1a99a;display:grid;place-items:center;position:relative;z-index:1;transition:background .25s,color .25s,border-color .25s}
.stage-icon svg{width:27px;height:27px;display:block;overflow:visible}
.stage-copy{padding:5px 0 18px}
.stage-title{font-size:12px;font-weight:600;color:#9a9e93;line-height:1.4}
.stage-note{font-size:10px;color:#a8aca2;margin-top:4px;line-height:1.5}
.stage.done .stage-icon{background:#e7eee2;border-color:#d9e3d2;color:#55764b}
.stage.done .stage-title{color:var(--deep)}
.stage.done .stage-note{color:#89917f}
.stage.current .stage-icon{background:#526b49;border-color:#526b49;color:#fff;box-shadow:0 0 0 4px #e7ede2}
.stage.current .stage-title{color:var(--deep);font-weight:700}
.stage.current .stage-note{color:var(--green)}
.cancelled-panel{display:flex;gap:12px;align-items:flex-start;padding:15px;border-radius:15px;background:#f5e9e5;color:#98584f;font-size:11px;line-height:1.6;margin:8px 0 20px}
.cancelled-panel svg{width:20px;height:20px;flex:none}
@media(min-width:560px){.stage{min-height:70px}.stage-copy{padding-top:6px}}
.section-title{font:500 29px/1.1 "Cormorant Garamond",serif;margin:25px 0 12px}.items{display:grid;gap:9px}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:13px;background:#f1f3eb;font-size:11px;line-height:1.6}.item b{white-space:nowrap}
.total{display:flex;justify-content:space-between;gap:12px;padding-top:15px;margin-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:700}
.info{font-size:10px;line-height:1.8;color:var(--muted);margin:18px 0 0}.error{padding:22px;text-align:center;border:1px solid white;border-radius:22px;background:#ffffff91;color:var(--muted);font-size:12px;line-height:1.8}
.error strong{display:block;font:500 29px "Cormorant Garamond",serif;color:var(--ink);margin-bottom:8px}
footer{text-align:center;padding:22px;color:var(--muted);font-size:10px}@media(max-width:480px){.top{padding:18px 5%}.back{font-size:11px}main{margin:35px auto 50px}.paper{border-radius:22px}}
</style></head><body>
<header class="top"><nav class="nav"><a class="logo" href="index.html">LEP<span>Í</span></a><a class="back" href="index.html">← Вернуться в каталог</a></nav></header>
<main><div class="kicker">LEPÍ · информация о заказе</div><h1>Ваш заказ</h1><p class="sub">Здесь можно посмотреть текущий статус. Страница обновляется автоматически.</p>
<div id="content" class="error"><strong>Загружаем заказ…</strong>Пожалуйста, подождите.</div></main><footer>LEPÍ · вкус домашнего уюта</footer>
<script>
"use strict";
const API="https://lepi-orders.onrender.com/api/track",token=new URLSearchParams(location.search).get("token")||"";
const labels={new:"Заказ получен",accepted:"Принят в работу",preparing:"Готовим ваш заказ",ready:"Заказ готов",courier:"Передан курьеру",completed:"Заказ завершён",cancelled:"Заказ отменён"};
const stages=[
 {key:"new",title:"Заказ получен",note:"Мы получили ваш заказ",icon:'<path d="M8 4.5h7l4 4v11H8z" fill="currentColor" opacity=".12"/><path d="M8 4.5h7l4 4v11H8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M15 4.8v4h4M11 12h5M11 15.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5 8v13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>'},
 {key:"accepted",title:"Подтверждение заказа",note:"Заказ принят командой LEPÍ",icon:'<rect x="5" y="5" width="14" height="14" rx="4" fill="currentColor" opacity=".12"/><path d="M8.5 12.2 11 14.7l5-5.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 3.8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>'},
 {key:"preparing",title:"Приготовление",note:"Ваш заказ готовится",icon:'<path d="M5 11h14l-1.1 8H6.1z" fill="currentColor" opacity=".12"/><path d="M5 11h14l-1.1 8H6.1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 11h16M8 8.5c-1-1 .8-1.7 0-2.8M12 8.5c-1-1 .8-1.7 0-2.8M16 8.5c-1-1 .8-1.7 0-2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 15h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".55"/>'},
 {key:"ready",title:"Заказ готов",note:"Всё собрано и подготовлено",icon:'<path d="m4.5 9 7.5-4 7.5 4v8l-7.5 4-7.5-4z" fill="currentColor" opacity=".12"/><path d="m4.5 9 7.5-4 7.5 4v8l-7.5 4-7.5-4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.8 9.2 12 13l7.2-3.8M12 13v8M9 7l7.2 3.8" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m9.2 15.2 1.8 1.8 3.8-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'},
 {key:"courier",title:"Передан курьеру",note:"Заказ отправился к вам",icon:'<path d="M3.5 7h10v10h-10z" fill="currentColor" opacity=".12"/><path d="M3.5 7h10v10h-10zM13.5 10h4l3 3v4h-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="7.5" cy="18" r="2" fill="currentColor" opacity=".18"/><circle cx="17.2" cy="18" r="2" fill="currentColor" opacity=".18"/><circle cx="7.5" cy="18" r="1.5" stroke="currentColor" stroke-width="1.4"/><circle cx="17.2" cy="18" r="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M15 12h2.2l1.6 1.8H15z" fill="currentColor" opacity=".4"/>'},
 {key:"completed",title:"Доставлен",note:"Заказ успешно завершён",icon:'<path d="M4.5 11.5 12 5l7.5 6.5v7h-15z" fill="currentColor" opacity=".12"/><path d="M4.5 11.5 12 5l7.5 6.5v7h-15z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 19v-5h6v5M9.2 11.8l1.8 1.8 3.9-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'}
];
function stageIcon(paths){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths+'</svg>'}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(v){try{return new Intl.DateTimeFormat("ru-RU",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v))}catch{return ""}}
async function load(){
 const el=document.getElementById("content");
 if(!/^[a-f0-9]{48}$/.test(token)){el.innerHTML="<strong>Ссылка недействительна</strong>Проверьте, что вы открыли ссылку из сообщения после оформления заказа.";return}
 try{
  const r=await fetch(API+"?token="+encodeURIComponent(token),{cache:"no-store"});
  if(r.status===404){el.innerHTML="<strong>Заказ не найден</strong>Возможно, ссылка указана неверно.";return}
  if(!r.ok)throw new Error("Tracking unavailable");
  const o=(await r.json()).order||{},step=stages.findIndex(x=>x.key===o.status),cancelled=o.status==="cancelled",items=Array.isArray(o.items)?o.items:[];
  const completedIndex=o.status==="completed"?stages.length-1:step;
  const stageMarkup=stages.map((stage,i)=>{
   const done=!cancelled&&i<completedIndex,current=!cancelled&&i===completedIndex;
   return '<div class="stage '+(done?'done ': '')+(current?'current':'')+'"><div class="stage-icon">'+stageIcon(stage.icon)+'</div><div class="stage-copy"><div class="stage-title">'+stage.title+'</div><div class="stage-note">'+(current?'Текущий этап · ': '')+stage.note+'</div></div></div>';
  }).join("");
  const completedCount=cancelled?0:(o.status==="completed"?stages.length:Math.max(0,completedIndex));
  el.className="paper";
  el.innerHTML='<div class="order-meta"><div class="order-no">№ '+esc(o.orderNumber)+'</div><div class="updated">Обновлено: '+esc(date(o.updatedAt))+'</div></div>'+
   '<div class="status" '+(cancelled?'style="background:#f3e4e1;color:#9b514a"':'')+'>'+esc(labels[o.status]||"Статус обновляется")+'</div>'+
   (cancelled?'<div class="cancelled-panel">'+stageIcon('<path d="m8 8 8 8M16 8l-8 8"/><circle cx="12" cy="12" r="9"/>')+'<span>Этот заказ отменён. Если у вас есть вопросы, свяжитесь с командой LEPÍ.</span></div>':'<div class="progress-head"><span class="progress-label">Этапы заказа</span><span class="progress-count">'+completedCount+' / '+stages.length+' завершено</span></div><div class="timeline">'+stageMarkup+'</div>')+
   '<div class="section-title">Состав заказа</div><div class="items">'+items.map(x=>'<div class="item"><span>'+esc(x.name||x.title||"Товар")+' · '+esc(x.quantity||1)+' шт.</span><b>'+esc(x.price??"")+(String(x.price??"").includes("сомони")?"":" сомони")+'</b></div>').join("")+'</div>'+
   '<div class="total"><span>Итого за товары</span><span>'+esc(o.total)+'</span></div>'+
   '<p class="info">Заказ оформлен: '+esc(date(o.createdAt))+'<br>Доставка оплачивается отдельно. Для уточнения деталей с вами свяжется представитель LEPÍ. Телефон и адрес на этой странице не отображаются.</p>';
 }catch(e){el.className="error";el.innerHTML="<strong>Не удалось загрузить заказ</strong>Проверьте интернет и обновите страницу."}
}
load();setInterval(load,20000);
</script></body></html>
