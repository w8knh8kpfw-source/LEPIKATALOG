<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ec">
<meta name="description" content="Отслеживание заказа LEPÍ.">
<title>Ваш заказ — LEPÍ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f3ec;--white:#fffefa;--ink:#252b24;--muted:#85897f;--green:#627653;--green-dark:#40543a;--line:#e7e8df;--soft:#edf0e8;--red:#9d554b}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"DM Sans",sans-serif;background:var(--paper);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit}
.top{height:76px;border-bottom:1px solid #e9e8df;background:rgba(255,254,250,.72)}
.nav{width:min(1040px,90%);height:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font:600 34px/1 "Playfair Display",serif;letter-spacing:.12em}.logo span{color:var(--green)}
.back{font-size:12px;color:#62695d;transition:color .2s}.back:hover{color:var(--green-dark)}
main{width:min(1040px,90%);margin:54px auto 80px}
.eyebrow{font-size:10px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;color:var(--green)}
.page-title{font:400 clamp(43px,7vw,68px)/1.04 "Playfair Display",serif;letter-spacing:-.045em;margin:13px 0 10px}
.intro{font-size:13px;line-height:1.8;color:var(--muted);margin:0;max-width:540px}
.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr);gap:20px;align-items:start;margin-top:34px}
.panel{background:var(--white);border:1px solid #e9e8df;border-radius:5px;box-shadow:0 12px 36px #3e49300a}
.progress-panel{padding:clamp(22px,4vw,36px)}
.order-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.order-label{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:7px}
.order-number{font-size:14px;font-weight:700;letter-spacing:.035em}
.copy{border:0;border-bottom:1px solid #cbd2c3;background:none;color:var(--green-dark);font-size:10px;font-weight:700;padding:5px 0;cursor:pointer}
.copy:hover{border-color:var(--green-dark)}
.current{padding:26px 0 24px}
.current-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.current-title{font:400 clamp(26px,4vw,36px)/1.15 "Playfair Display",serif;margin:0 0 8px}
.current-note{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
.progress-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:5px 0 10px}
.progress-caption{font-size:10px;color:#777d71}
.progress-fraction{font-size:10px;font-weight:700;color:var(--green-dark);font-variant-numeric:tabular-nums}
.bar{height:3px;background:#e9ebe4;overflow:hidden}
.bar-fill{height:100%;background:var(--green);width:0;transition:width .5s ease}
.steps{list-style:none;padding:26px 0 0;margin:0;display:grid;grid-template-columns:1fr 1fr;column-gap:24px;row-gap:0}
.step{position:relative;display:grid;grid-template-columns:29px 1fr;gap:10px;min-height:78px;padding:0 0 20px}
.step:nth-child(odd):after{content:"";position:absolute;left:13px;top:28px;bottom:0;width:1px;background:#e7e9e2}
.step:last-child:after{display:none}
.step-marker{position:relative;z-index:1;width:27px;height:27px;border:1px solid #dfe2d9;border-radius:50%;background:var(--white);display:grid;place-items:center;color:#a5aa9e;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.step.done .step-marker{background:var(--green);border-color:var(--green);color:white}
.step.current .step-marker{border:1.5px solid var(--green);color:var(--green-dark);box-shadow:0 0 0 4px #edf1e8}
.step-name{font-size:11px;line-height:1.45;font-weight:600;color:#9a9e94;padding-top:5px}
.step.done .step-name,.step.current .step-name{color:var(--ink)}
.step-desc{font-size:9px;line-height:1.5;color:#a1a59b;margin-top:5px}
.step.current .step-desc{color:var(--green)}
.side{display:grid;gap:14px}
.side-panel{padding:23px}
.side-title{font:400 23px/1.2 "Playfair Display",serif;margin:0 0 17px}
.item-list{display:grid;gap:13px}
.item{display:flex;justify-content:space-between;gap:12px;font-size:11px;line-height:1.55}
.item-name{color:#555d50}.item-price{font-weight:600;white-space:nowrap}
.total{border-top:1px solid var(--line);margin-top:17px;padding-top:16px;display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700}
.meta-list{display:grid;gap:13px}
.meta-row{display:flex;justify-content:space-between;gap:15px;font-size:10px;line-height:1.5}
.meta-row span:first-child{color:var(--muted)}.meta-row span:last-child{text-align:right;font-weight:600}
.refresh-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-top:15px;border-top:1px solid var(--line)}
.refresh-time{font-size:9px;color:var(--muted);line-height:1.6}
.refresh{border:1px solid #dfe4d9;background:#f8f9f5;color:var(--green-dark);border-radius:3px;padding:9px 12px;font-size:10px;font-weight:700;cursor:pointer;transition:background .2s}
.refresh:hover{background:#edf1e8}.refresh:disabled{opacity:.55;cursor:wait}
.notice{font-size:10px;line-height:1.8;color:var(--muted);padding:16px 18px;border-left:2px solid #d5ddce;background:#f0f2eb}
.cancelled{padding:17px 18px;background:#f7eeeb;border-left:2px solid #bd8177;color:var(--red);font-size:11px;line-height:1.7;margin-top:16px}
.error{background:var(--white);border:1px solid #e9e8df;padding:34px;text-align:center;max-width:540px;margin:34px auto;border-radius:5px}
.error h2{font:400 29px "Playfair Display",serif;margin:0 0 10px}.error p{font-size:12px;line-height:1.8;color:var(--muted);margin:0}
footer{padding:24px 5%;border-top:1px solid #e9e8df;text-align:center;font-size:9px;letter-spacing:.12em;color:#999c91}
@media(max-width:760px){main{margin:39px auto 58px}.layout{grid-template-columns:1fr;gap:14px}.side{grid-template-columns:1fr 1fr}.side-panel{padding:19px}.notice{grid-column:1/-1}}
@media(max-width:520px){.top{height:66px}.logo{font-size:30px}.back{font-size:10px}main{width:90%;margin-top:34px}.layout{margin-top:25px}.progress-panel{padding:21px 18px}.steps{grid-template-columns:1fr;row-gap:0}.step{min-height:66px;padding-bottom:13px}.step:nth-child(odd):after{display:block}.step:last-child:after{display:none}.side{grid-template-columns:1fr}.side-panel{padding:21px}.current{padding:23px 0 19px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><a class="logo" href="index.html">LEP<span>Í</span></a><a class="back" href="index.html">← Вернуться в каталог</a></nav></header>
<main>
<div class="eyebrow">LEPÍ · сопровождение заказа</div>
<h1 class="page-title">Ваш заказ.</h1>
<p class="intro">Вся информация о заказе собрана здесь. Мы будем обновлять этапы по мере его приготовления и доставки.</p>
<div id="content" class="error"><h2>Загружаем заказ</h2><p>Пожалуйста, подождите несколько секунд.</p></div>
</main>
<footer>LEPÍ &nbsp;·&nbsp; ВКУС ДОМАШНЕГО УЮТА</footer>
<script>
"use strict";
const API="https://lepi-orders.onrender.com/api/track";
const token=new URLSearchParams(location.search).get("token")||"";
const stages=[
 {key:"new",title:"Заказ получен",desc:"Мы получили ваш заказ"},
 {key:"accepted",title:"Подтверждение",desc:"Команда LEPÍ приняла заказ"},
 {key:"preparing",title:"Приготовление",desc:"Мы готовим ваш заказ"},
 {key:"ready",title:"Всё готово",desc:"Заказ собран и подготовлен"},
 {key:"courier",title:"В пути",desc:"Заказ передан курьеру"},
 {key:"completed",title:"Доставлен",desc:"Заказ успешно завершён"}
];
const labels={new:"Заказ получен",accepted:"Принят в работу",preparing:"Готовим ваш заказ",ready:"Заказ готов",courier:"Передан курьеру",completed:"Заказ доставлен",cancelled:"Заказ отменён"};
let lastOrder=null,loading=false;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":new Intl.DateTimeFormat("ru-RU",{dateStyle:"medium",timeStyle:"short"}).format(d)}
function errorView(title,message){const el=document.getElementById("content");el.className="error";el.innerHTML="<h2>"+esc(title)+"</h2><p>"+esc(message)+"</p>"}
function render(o){
 lastOrder=o;
 const el=document.getElementById("content");
 const status=o.status||"new",index=stages.findIndex(s=>s.key===status),cancelled=status==="cancelled";
 const currentIndex=status==="completed"?5:Math.max(0,index);
 const doneCount=cancelled?0:status==="completed"?6:Math.max(0,index);
 const percent=cancelled?0:Math.round(doneCount/6*100);
 const current=stages[currentIndex]||stages[0];
 const items=Array.isArray(o.items)?o.items:[];
 const steps=stages.map((s,i)=>{
  const state=!cancelled&&i<currentIndex?"done":!cancelled&&i===currentIndex?"current":"";
  return '<li class="step '+state+'"><span class="step-marker">'+(i<currentIndex&&!cancelled?"✓":String(i+1).padStart(2,"0"))+'</span><div><div class="step-name">'+s.title+'</div><div class="step-desc">'+s.desc+'</div></div></li>';
 }).join("");
 const itemRows=items.map(x=>{
  const qty=Number(x.quantity)||1;
  const price=x.price===undefined||x.price===null?"":String(x.price).includes("сомони")?String(x.price):String(x.price)+" сомони";
  return '<div class="item"><span class="item-name">'+esc(x.name||x.title||"Товар")+' · '+qty+' шт.</span><span class="item-price">'+esc(price)+'</span></div>';
 }).join("");
 const total=String(o.total??"—");
 el.className="layout";
 el.innerHTML=
 '<section class="panel progress-panel">'+
  '<div class="order-head"><div><div class="order-label">Номер заказа</div><div class="order-number" id="order-number">'+esc(o.orderNumber||"—")+'</div></div><button class="copy" id="copy-order" type="button">Скопировать номер</button></div>'+
  '<div class="current"><div class="current-label">Текущий статус</div><h2 class="current-title">'+esc(labels[status]||"Статус обновляется")+'</h2><p class="current-note">'+(cancelled?"Этот заказ отменён. Если у вас есть вопросы, свяжитесь с командой LEPÍ.":esc(current.desc))+'</p></div>'+
  (cancelled?'<div class="cancelled">Статусы этого заказа больше не обновляются. По любым вопросам обратитесь к команде LEPÍ.</div>':
   '<div class="progress-meta"><span class="progress-caption">Путь вашего заказа</span><span class="progress-fraction">'+doneCount+' из 6 этапов</span></div><div class="bar"><div class="bar-fill" style="width:'+percent+'%"></div></div><ol class="steps">'+steps+'</ol>')+
 '</section>'+
 '<aside class="side">'+
  '<section class="panel side-panel"><h2 class="side-title">В заказе</h2><div class="item-list">'+(itemRows||'<div class="item"><span class="item-name">Состав заказа не указан</span></div>')+'</div><div class="total"><span>Итого за товары</span><span>'+esc(total)+'</span></div></section>'+
  '<section class="panel side-panel"><h2 class="side-title">Детали</h2><div class="meta-list"><div class="meta-row"><span>Создан</span><span>'+esc(date(o.createdAt))+'</span></div><div class="meta-row"><span>Последнее обновление</span><span id="updated-at">'+esc(date(o.updatedAt))+'</span></div><div class="meta-row"><span>Номер</span><span>'+esc(o.orderNumber||"—")+'</span></div></div><div class="refresh-row"><span class="refresh-time" id="refresh-time">Обновление автоматически<br>каждые 20 секунд</span><button class="refresh" id="refresh" type="button">Обновить</button></div></section>'+
  '<div class="notice">Мы не показываем на этой странице ваш номер телефона, адрес или комментарий к заказу.</div>'+
 '</aside>';
 document.getElementById("copy-order").addEventListener("click",async()=>{
  const b=document.getElementById("copy-order");
  try{await navigator.clipboard.writeText(String(o.orderNumber||""));b.textContent="Скопировано";}
  catch{b.textContent="Не удалось скопировать";}
  setTimeout(()=>{if(b.isConnected)b.textContent="Скопировать номер"},1800);
 });
 document.getElementById("refresh").addEventListener("click",()=>load(true));
}
async function load(manual=false){
 if(loading)return;loading=true;
 const button=document.getElementById("refresh");if(button){button.disabled=true;button.textContent="Обновляем…"}
 try{
  if(!/^[a-f0-9]{48}$/.test(token)){errorView("Ссылка недействительна","Откройте ссылку для отслеживания из сообщения после оформления заказа.");return}
  const r=await fetch(API+"?token="+encodeURIComponent(token),{cache:"no-store"});
  if(r.status===404){errorView("Заказ не найден","Проверьте ссылку или обратитесь к команде LEPÍ.");return}
  if(!r.ok)throw new Error("Request failed");
  const data=await r.json();if(!data.order)throw new Error("Missing order");
  render(data.order);
  const time=document.getElementById("refresh-time");
  if(time)time.textContent=manual?"Только что обновлено":"Обновление автоматически · каждые 20 секунд";
 }catch(e){
  if(lastOrder){const time=document.getElementById("refresh-time");if(time)time.textContent="Не удалось обновить · повторим позже"}
  else errorView("Не удалось загрузить заказ","Проверьте подключение к интернету и попробуйте ещё раз.");
 }finally{
  loading=false;const b=document.getElementById("refresh");if(b){b.disabled=false;b.textContent="Обновить"}
 }
}
load();setInterval(()=>load(false),20000);
</script>
</body>
</html>
